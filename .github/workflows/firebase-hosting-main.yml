name: Publish Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and prepare application files
        run: |
          for file in *.js scripts/*.cjs; do node --check "$file"; done
          node scripts/prepare-hosting.cjs
      - name: Publish approved main branch
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EITA_QUIZ }}'
          projectId: eita-quiz
          channelId: live
