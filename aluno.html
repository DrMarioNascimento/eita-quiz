<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eita! · Aluno</title><link rel="stylesheet" href="styles.css"><style>body{background:#08162d url('assets/ceu-original.png') center/cover fixed}.student-page{max-width:640px;margin:24px auto;padding:20px}.student-page .control-card{padding:24px}.student-page input{width:100%;box-sizing:border-box}.student-answers{display:grid;gap:12px}.student-answers button{min-height:64px;font-size:18px}.emoji-picker{display:flex;flex-wrap:wrap;gap:8px}.emoji-picker button{width:52px;font-size:28px}.emoji-picker button[aria-pressed=true]{outline:3px solid #c6ff45}.student-page h1{font-size:42px}</style></head><body><div class="student-page"><h1>Eita!</h1><div class="control-card" id="joinPanel"><h2>Entrar na turma</h2><label for="code">Código da sala</label><input id="code" inputmode="numeric" maxlength="6"><label for="name">Seu nome</label><input id="name" maxlength="30" autocomplete="given-name"><p>Escolha seu animal</p><div id="emojis" class="emoji-picker"></div><button id="joinOnline" class="primary">Entrar</button></div><div id="playPanel" class="control-card" hidden><p id="identity"></p><p id="group"></p><h2 id="studentQuestion">Aguardando o professor…</h2><p id="studentTimer"></p><div id="studentAnswers" class="student-answers"></div><p id="studentResult"></p></div><p id="studentNotice" role="status"></p></div><script type="module" src="student.js"></script></body></html>
